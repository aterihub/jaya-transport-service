# Builds the MQTT ingestion service image in CI and publishes it to GHCR.
#
# Runs alongside the existing Docker Hub workflows rather than replacing them.

name: Publish image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Build (but do not publish) on PRs, so a branch is proven to build in CI
  # before it is merged. workflow_dispatch cannot cover this: it only offers
  # workflows that already exist on the default branch.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: jaya-transport-service

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Nothing is published from a pull request.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Assert the binary runs and no dotenv was baked in
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:sha-${{ github.sha }}"
          docker pull -q "$image"

          # Every config key is `required`, so with no environment the process
          # must fail fast on config rather than on a missing/corrupt binary.
          out=$(docker run --rm "$image" 2>&1 || true)
          case "$out" in
            *"exec format error"*|*"not found"*)
              echo "::error::binary did not execute: $out"; exit 1 ;;
          esac

          if docker run --rm --entrypoint sh "$image" -c \
               'ls -a / /app 2>/dev/null | grep -qE "^\.env"'; then
            echo "::error::a .env file is present in $image"
            exit 1
          fi
          echo "binary executes and no dotenv file present"
